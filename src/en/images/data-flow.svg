    <rect x="10" y="50" width="130" height="60" rx="6"/>
    <rect x="250" y="50" width="150" height="60" rx="6"/>
    <rect x="490" y="50" width="140" height="60" rx="6"/>
    <rect x="250" y="150" width="150" height="40" rx="6"/>
