# po4a configuration: English AsciiDoc is the master; translations live in
# l10n/po/<lang>.po. Run `make l10n-update` after changing the English source.
[po4a_langs] es ja
[po4a_paths] l10n/po/mdss.pot $lang:l10n/po/$lang.po
[options] opt:"--master-charset UTF-8 --localized-charset UTF-8 --package-name mdss"

[type: asciidoc] src/en/01-scope.adoc $lang:$lang/01-scope.adoc opt:"-o tablecells"
[type: asciidoc] src/en/02-normative-references.adoc $lang:$lang/02-normative-references.adoc opt:"-o tablecells"
[type: asciidoc] src/en/03-terms.adoc $lang:$lang/03-terms.adoc opt:"-o tablecells"
[type: asciidoc] src/en/04-access-management.adoc $lang:$lang/04-access-management.adoc opt:"-o tablecells"
[type: asciidoc] src/en/05-data-protection.adoc $lang:$lang/05-data-protection.adoc opt:"-o tablecells"
[type: asciidoc] src/en/06-logging-monitoring.adoc $lang:$lang/06-logging-monitoring.adoc opt:"-o tablecells"
[type: asciidoc] src/en/annex-a-guidance.adoc $lang:$lang/annex-a-guidance.adoc opt:"-o tablecells"
[type: asciidoc] src/en/bibliography.adoc $lang:$lang/bibliography.adoc opt:"-o tablecells"
[type: asciidoc] src/en/standard.adoc $lang:$lang/standard.adoc opt:"-o tablecells"
